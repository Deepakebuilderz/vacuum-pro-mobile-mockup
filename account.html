<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .profile-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 15px; background: #edf3fb; }
    .profile-card p { margin: 0; overflow-wrap: anywhere; }
    .profile-avatar { flex: 0 0 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; background: #203b66; color: #fff; font-weight: 750; }
    .account-menu { display: grid; border: 1px solid var(--rule); border-radius: 14px; }
    .account-menu > * + * { border-top: 1px solid var(--rule); }
    .account-row, .account-menu summary { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 54px; padding: 9px 12px; text-align: left; color: var(--navy); background: transparent; box-shadow: none; cursor: pointer; }
    .account-row .account-copy { flex: 1; }
    .account-copy { display: grid; gap: 2px; font-size: 14px; font-weight: 700; }
    .account-copy small { font-size: 12px; color: var(--muted); font-weight: 400; }
    .account-menu summary { justify-content: space-between; list-style: none; }
    .account-menu summary::-webkit-details-marker { display: none; }
    .account-menu details form { padding: 0 12px 12px; }
    .account-logout { align-self: center; background: transparent; color: #244b81; box-shadow: none; }
  </style>
</head>
<body data-screen="account">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"><small>DEMO</small></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      if (!signed) return title('My account') + '<p>Log in to view your orders and saved address.</p>' +
        actions(['Use Deepak’s demo account','demo-account'], ['Log in','login'], ['Create an account','signup'], ['Get help','support']);

      const recent = accountOrder();
      const address = savedAddress();
      const name = [address.first ?? contact.first, address.last ?? contact.last].filter(Boolean).join(' ');
      const row = (label, detail, route) => '<button type="button" class="account-row" data-go="' + route +
        '"><span class="account-copy">' + label + '<small>' + detail + '</small></span><span aria-hidden="true">›</span></button>';
      const addressField = (label, key, attributes = '') => '<label>' + label + '<input name="' + key +
        '" value="' + escapeHTML(address[key] ?? contact[key]) + '" ' + attributes + ' required></label>';
      const addressFields = '<div class="pair">' + addressField('First name','first') + addressField('Last name','last') +
        '</div>' + addressField('Street address','address') + addressField('City','city') + '<div class="pair">' +
        addressField('State','state') + addressField('ZIP code','zip','inputmode="numeric" pattern="[0-9]{5}"') + '</div>';

      return title('My account') +
        '<section class="profile-card"><span class="profile-avatar" aria-hidden="true">' + escapeHTML((name || accountEmail || 'V')[0].toUpperCase()) +
        '</span><div><strong>' + escapeHTML(name || 'Vacuum PRO customer') + '</strong><p class="quiet">' + escapeHTML(accountEmail) + '</p></div></section>' +
        '<section class="account-menu" aria-label="Account options">' +
        row('Orders', recent ? 'Latest order #' + recent.number : 'View order history and tracking', 'orders') +
        '<details><summary><span class="account-copy">Saved address<small>' +
        (address.address ? escapeHTML(address.city + ', ' + address.state) : 'Add a shipping address') +
        '</small></span><span aria-hidden="true">⌄</span></summary>' +
        form('saved-address', addressFields, 'Save address') + '</details>' +
        row('Wishlist', wishlist.length + (wishlist.length === 1 ? ' saved item' : ' saved items'), 'wishlist') +
        row('Returns & support', 'Get help with an order or a part', 'support') +
        '</section><button type="button" class="account-logout" data-go="logout">Log out</button>';
    });
  </script>
</body>
</html>
