<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signup · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body[data-screen="signup"] .auth-content {
      width: min(100%, 326px);
      gap: 16px;
    }
    body[data-screen="signup"] .stage[data-centered="true"] main {
      padding-block: 20px;
    }
    .signup-intro {
      text-align: left;
    }
    #signup {
      gap: 11px;
    }
    #signup input {
      min-width: 0;
      min-height: 46px;
      font-size: 16px;
      font-weight: 400;
      background: #f7f9fc;
      border-color: #c8d5e7;
      border-radius: 10px;
    }
    #signup input:focus { background: #fff; }
    #signup .signup-submit {
      min-height: 50px;
      margin-top: 5px;
      border-radius: 14px;
      background: linear-gradient(105deg, #182d52, #284f86);
    }
    .signup-login {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      color: var(--muted);
    }
    .signup-login button {
      min-height: 44px;
      padding-inline: 8px;
      background: transparent;
      color: #234c8a;
      box-shadow: none;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (max-width: 340px) {
    </style>
</head>
<body data-screen="signup">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => `
      <section class="signup-intro">
        <h1 tabindex="-1">Create your account</h1>
      </section>
      <form id="signup">
        <label>First name
          <input name="first-name" autocomplete="given-name" required>
        </label>
        <label>Last name
          <input name="last-name" autocomplete="family-name" required>
        </label>
        <label>Email address
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <button class="signup-submit" type="submit">Create account</button>
      </form>
      <div class="signup-login">
        <span>Already registered?</span>
        <button type="button" data-go="login">Log in</button>
      </div>
    `);
  </script>
</body>
</html>
