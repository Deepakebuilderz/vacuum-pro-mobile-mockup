<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .stage[data-page="delivery"] main { gap: 12px; }
    .stage[data-page="delivery"] h1 { font-size: 24px; }
    .stage[data-page="delivery"] .progress {
      padding: 4px;
      border-radius: 11px;
      background: #edf3fb;
      gap: 3px;
    }
    .stage[data-page="delivery"] .progress > * {
      border: 0;
      padding: 6px 2px;
      font-size: 11px;
      border-radius: 8px;
    }
    .stage[data-page="delivery"] .progress [aria-current] { background: #203b66; color: white; }
    #delivery fieldset { display: grid; gap: 9px; margin: 0; padding: 0; border: 0; min-width: 0; }
    #delivery .option {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 10px;
      min-height: 64px;
      padding: 11px;
    }
    .delivery-label { display: grid; gap: 3px; line-height: 1.25; }
    .delivery-label small { color: var(--muted); font-size: 12px; font-weight: 400; }
    .delivery-price { color: #203b66; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #delivery .checkout-box h2 { font-size: 17px; }
    #delivery button { background: linear-gradient(105deg, #182d52, #284f86); }
  </style>
</head>
<body data-screen="delivery">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const choices = '<fieldset aria-label="Delivery options">' +
        option('method', 'shipping', '<span class="delivery-label"><strong>Standard shipping</strong><small>Usually 2–5 business days for in-stock orders</small></span><strong class="delivery-price">At checkout</strong>', delivery === 'shipping') +
        option('method', 'pickup', '<span class="delivery-label"><strong>Local pickup</strong><small>2785 Richmond Hwy, Unit 5-101<br>Stafford, VA 22554</small></span><strong class="delivery-price">If eligible</strong>', delivery === 'pickup') +
        '</fieldset>';
      return step(1, 'Delivery method', 'Choose how to receive your order.') +
        form('delivery', choices + summary(), 'Continue to payment');
    });
  </script>
</body>
</html>
