<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .pdp-photo { position: relative; }
    .pdp-save {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      background: white;
      color: #244b81;
      border: 1px solid var(--rule);
      border-radius: 50%;
    }
    .pdp-save svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .pdp-save[aria-pressed="true"] svg { fill: currentColor; }
    .pdp-related { display: grid; gap: 8px; }
    .pdp-related h2, .pdp-related p { margin: 0; }
    .pdp-related h2 { font-size: 16px; }
    .pdp-related img { border-radius: 8px; background: #f7f9fc; }
  </style>
</head>
<body data-screen="product">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const part = catalog[current];
      const modelMatch = current === 0 && verified && productSource === 'results';
      const category = partCategory(part);
      const alternatives = catalog.map((_, index) => index).filter(index => index !== current && (!part.id || catalog[index].id));
      const sameCategory = alternatives.filter(index => partCategory(catalog[index]) === category);
      const sameBrand = alternatives.filter(index => catalog[index].brand === part.brand);
      const related = [...new Set([...sameCategory, ...sameBrand, ...alternatives])].slice(0, 2);
      return `
        <div class="pdp-photo"><img src="${part.img}" alt="${part.categoryPhoto ? category + ' category illustration' : part.name}">
          <button class="pdp-save" type="button" data-go="toggle-wishlist" aria-label="Save to wishlist" aria-pressed="${wishlist.includes(part.id || part.sku)}">
            <svg viewBox="0 0 24 24" aria-hidden="true">${tabIcons.wishlist}</svg>
          </button>
        </div>
        <section class="pdp-details">
          <p class="pdp-part">${part.brand} · Part #${part.sku}</p>
          ${title(part.name)}
          <p class="pdp-spec">${part.pack}${part.categoryPhoto ? ' · Category image' : ''}</p>
        </section>
        <section class="pdp-fit">
          <h2>${modelMatch ? 'Matches your model search' : 'Check compatibility'}</h2>
          <p>${modelMatch ? 'Compare your full model number with the listing before ordering.' : 'Have your vacuum model number handy before ordering.'}</p>
          ${button(current === 0 ? 'Check Oreck model' : 'Get fitment help', current === 0 ? 'confirm' : 'support', true)}
        </section>
        <section class="pdp-related" aria-labelledby="related-parts-title">
          <h2 id="related-parts-title">Related products</h2>
          <p class="quiet">Check model compatibility before ordering.</p>
          ${grid(related)}
        </section>
      `;
    });
  </script>
</body>
</html>
