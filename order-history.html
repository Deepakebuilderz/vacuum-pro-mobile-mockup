<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order history · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .stage[data-page="orders"] h1 { font-size: 25px; }
    .history-card { overflow: hidden; border: 1px solid var(--rule); border-radius: 15px; background: #fff; }
    .history-header { display: flex; justify-content: space-between; align-items: start; gap: 10px; padding: 13px; background: #f3f7fd; }
    .history-header h2 { margin: 0; font-size: 16px; }
    .history-header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .history-status { padding: 4px 8px; border-radius: 20px; color: #81511c; background: #ffedcf; font-size: 11px; font-weight: 700; }
    .history-items { margin: 0; padding: 0 13px; list-style: none; }
    .history-items li { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; align-items: center; gap: 9px; min-height: 59px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13px; line-height: 1.35; }
    .history-items img, .history-thumb { width: 42px; height: 42px; padding: 3px; border-radius: 7px; background: #f3f7fd; object-fit: contain; }
    .history-items small { color: var(--muted); white-space: nowrap; }
    .history-action { padding: 8px 13px; }
    .history-action button { width: 100%; display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 8px; color: #244b81; background: #eef4fd; box-shadow: none; }
    .history-empty { text-align: center; }
  </style>
</head>
<body data-screen="orders">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const recent = accountOrder();
      if (!recent) return '<div class="centered-content history-empty">' + title('Order history') +
        '<p>No orders yet.</p>' + actions(['Browse products','browse']) + '</div>';
      const count = recent.lines.reduce((sum, [, quantity]) => sum + quantity, 0);
      const items = recent.lines.map(([name, quantity]) => {
        const part = catalog.find(product => product.name === name);
        const thumbnail = part ? '<img src="' + part.img + '" alt="">' : '<span class="history-thumb" aria-hidden="true"></span>';
        return '<li>' + thumbnail + '<strong>' + escapeHTML(name) + '</strong><small>Qty ' + quantity + '</small></li>';
      }).join('');
      const sampleAction = signed && accountEmail === demoEmail && recent !== sampleOrder
        ? actions(['View shipped demo order','sample-order']) : '';
      return title('Order history') +
        '<article class="history-card"><div class="history-header"><div><h2>Order #' + recent.number +
        '</h2><p>' + count + (count === 1 ? ' item' : ' items') + '</p></div><span class="history-status">' + (recent.shipment ? 'Shipped' : 'Processing') + '</span></div>' +
        '<ul class="history-items">' + items + '</ul>' +
        '<div class="history-action"><button type="button" data-go="detail">View order <span aria-hidden="true">›</span></button></div></article>' + sampleAction;
    });
  </script>
</body>
</html>
