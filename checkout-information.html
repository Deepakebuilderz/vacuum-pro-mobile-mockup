<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact and address · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .stage[data-page="checkout"] main { gap: 12px; }
    .stage[data-page="checkout"] h1 { font-size: 24px; }
    .stage[data-page="checkout"] .progress {
      padding: 4px;
      border-radius: 11px;
      background: #edf3fb;
      gap: 3px;
    }
    .stage[data-page="checkout"] .progress > * {
      border: 0;
      padding: 6px 2px;
      font-size: 11px;
      border-radius: 8px;
    }
    .stage[data-page="checkout"] .progress [aria-current] { background: #203b66; color: white; }
    #information { gap: 12px; }
    #information fieldset {
      margin: 0;
      min-width: 0;
      padding: 9px 12px 12px;
      border: 1px solid var(--rule);
      border-radius: 13px;
      background: #f7f9fd;
      display: grid;
      gap: 9px;
    }
    #information legend { padding: 0 5px; font-size: 13px; font-weight: 750; }
    #information label { font-size: 12px; } 
    #information input { min-width: 0; min-height: 44px; padding: 7px 9px; }
    #information .checkout-country { margin: 0; font-size: 12px; }
    #information button { background: linear-gradient(105deg, #182d52, #284f86); }
  </style>
</head>
<body data-screen="checkout">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const fields = `
        <fieldset>
          <legend>Contact</legend>
          ${input('Email address', 'email', 'email', 'autocomplete="email"')}
        </fieldset>
        <fieldset>
          <legend>Shipping address</legend>
          <div class="pair">
            ${input('First name', 'first', 'text', 'autocomplete="given-name"')}
            ${input('Last name', 'last', 'text', 'autocomplete="family-name"')}
          </div>
          ${input('Street address', 'address', 'text', 'autocomplete="address-line1"')}
          ${input('City', 'city', 'text', 'autocomplete="address-level2"')}
          <div class="pair">
            ${input('State', 'state', 'text', 'autocomplete="address-level1"')}
            ${input('ZIP code', 'zip', 'text', 'inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}"')}
          </div>
          <p class="quiet checkout-country">United States</p>
        </fieldset>
      `;
      return step(0, 'Contact & address', 'Demo checkout · ' + (signed ? 'Signed in' : 'Guest') + ' · Use sample details') +
        form('information', fields, 'Continue to delivery');
    });
  </script>
</body>
</html>
