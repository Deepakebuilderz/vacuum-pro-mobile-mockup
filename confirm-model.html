<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm model · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-screen="confirm">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    const scan = typeof mobileScreens !== 'undefined' ? mobileScreens.scanResult : null;
    const candidates = scan?.candidates || [];
    mountScreen(() => title(candidates.length ? 'Check the number' : 'No clear number found') +
      (scan?.preview ? '<img class="preview" src="'+escapeHTML(scan.preview)+'" alt="Your selected label or part photo" style="max-height:180px;object-fit:contain">' : '') +
      '<p>'+ (candidates.length ? 'Possible number found. Check every character against the printed number before searching. If it is wrong, take a closer photo of just the number or edit it below.' : 'No reliable model or part number was detected. Take a close-up of just the printed number, enter it manually, or ask for fitment help.') + '</p>' +
      (candidates.length > 1 ? '<label>Other detected numbers<select id="scan-candidates">'+candidates.map(value => '<option>'+escapeHTML(value)+'</option>').join('')+'</select></label>' : '') +
      form('model','<label>Model or part number<input name="model" value="'+escapeHTML(candidates[0] || '')+'" autocomplete="off" maxlength="80" required></label>','Search parts') +
      (scan?.visualAvailable ? '<section><h2>Only have a part photo?</h2><p>Find similar-looking products. Check your model and dimensions before ordering. Your selected photo will be sent to our photo matching service.</p><button type="button" id="find-similar">Find similar parts</button><div id="visual-results" role="status" aria-live="polite"></div></section>' : '<p class="quiet">Photo matching for unlabelled parts is not connected yet. Use fitment help if you cannot find a number.</p>') +
      actions(['Try another photo','scan'],['Get fitment help','support']));
    document.querySelector('#scan-candidates')?.addEventListener('change',event => { document.querySelector('input[name=model]').value = event.target.value; });
    document.querySelector('#find-similar')?.addEventListener('click',async event => {
      const button = event.currentTarget, slot = document.querySelector('#visual-results');
      button.disabled = true;
      slot.textContent = 'Comparing with catalog photos…';
      try {
        const result = await mobileScreens.visualSearch();
        for await (const items of mobileScreens.catalog('products')) syncParts(items);
        const products = result.ids.map(id => mobileScreens.products.get(id)).filter(Boolean);
        slot.innerHTML = products.length ? '<p>Visually similar only — compatibility has not been confirmed.</p>'+liveGrid(products) : '<p>No available catalog matches. Try another angle or contact fitment support.</p>';
      } catch (error) { slot.textContent = error.message; }
      finally { button.disabled = false; }
    });

  </script>
</body>
</html>
