<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a part · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .finder-search { display:grid; gap:16px; }
    .finder-heading h1 { margin:5px 0 8px; font-size:30px; letter-spacing:-.035em; }
    .finder-eyebrow { color:#52729c; font-size:10px; letter-spacing:.16em; font-weight:800; }
    .finder-heading p { margin:0; font-size:14px; color:var(--muted); }
    .finder-entry { gap:9px; padding:18px; border:1px solid #e3eaf4; border-radius:18px; background:#f8fafd; }
    .finder-entry label { font-weight:700; font-size:13px; }
    .finder-entry input { margin:0; padding:13px; font-size:16px; border-radius:11px; background:white; }
    .finder-submit { display:flex; justify-content:space-between; align-items:center; min-height:48px; border-radius:11px; box-shadow:none; }
    .finder-divider { display:flex; align-items:center; gap:12px; color:#8490a2; font-size:12px; }
    .finder-divider::before,.finder-divider::after { content:''; flex:1; height:1px; background:#e6ebf2; }
    .finder-photo { display:grid; gap:4px; }
    .finder-camera { display:flex; align-items:center; gap:13px; width:100%; padding:17px 15px; border:1px solid #dce7f6; border-radius:16px; background:#edf4ff; color:#1c3158; box-shadow:none; }
    .finder-camera strong,.finder-camera small { display:block; }
    .finder-camera strong { font-size:16px; }
    .finder-camera small { margin-top:3px; font-size:11px; font-weight:400; color:#61748f; }
    .finder-camera > span:last-child { margin-left:auto; font-size:20px; }
    .finder-camera-icon { display:grid; place-items:center; flex:0 0 44px; height:44px; border-radius:13px; background:white; }
    .finder-camera svg { width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; }
    .finder-gallery { min-height:44px; padding:10px; text-align:center; background:transparent; color:#365f94; font-size:13px; font-weight:600; box-shadow:none; text-decoration:underline; text-underline-offset:3px; }
    .finder-status { margin:0; padding:12px; background:#f4f7fb; border-radius:10px; font-size:13px; color:#53657f; }
    .finder-feedback { display:flex; align-items:flex-start; gap:12px; padding:12px; border:1px solid #dce7f6; border-radius:12px; }
    .finder-feedback img { width:56px; height:64px; border-radius:7px; object-fit:cover; }
    .finder-feedback > div { min-width:0; flex:1; }
    .finder-feedback strong { font-size:13px; }
    .finder-feedback p { margin:3px 0 8px; font-size:12px; color:var(--muted); }
    .finder-feedback select { display:block; width:100%; min-height:44px; margin-top:5px; padding:7px; border:1px solid #d5dfed; border-radius:8px; background:white; font:inherit; color:inherit; }
    .finder-search [hidden] { display:none; }
    .finder-search button:disabled { opacity:.6; cursor:wait; }
    .finder-hint { border:1px solid #e2e9f2; border-radius:15px; background:#fff; overflow:hidden; color:#61718a; }
    .finder-hint summary { display:flex; align-items:center; gap:11px; min-height:76px; padding:15px 13px; cursor:pointer; list-style:none; }
    .finder-hint summary::-webkit-details-marker { display:none; }
    .finder-hint summary:focus-visible { outline:2px solid #4779c4; outline-offset:-3px; border-radius:14px; }
    .finder-hint-icon { display:grid; place-items:center; flex:0 0 36px; height:40px; border-radius:10px; background:#f0f5fc; color:#5275a4; }
    .finder-hint svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .finder-hint-heading { flex:1; min-width:0; }
    .finder-hint-heading strong { display:block; color:#243d61; font-size:13px; line-height:1.4; font-weight:700; }
    .finder-hint-heading small { display:block; margin-top:3px; font-size:11px; line-height:1.5; }
    .finder-hint .finder-hint-chevron { flex:0 0 19px; width:19px; height:19px; color:#7890b0; transition:transform .18s; }
    .finder-hint[open] .finder-hint-chevron { transform:rotate(180deg); }
    .finder-hint-content { padding:0 16px 16px; font-size:13px; line-height:1.65; }
    .finder-hint-content > p { margin:0; padding-top:14px; border-top:1px solid #edf1f6; }
    .finder-hint-content ul { margin:9px 0 14px; padding-left:19px; }
    .finder-hint-content li { padding:2px 0 2px 2px; }
    .finder-hint-content li::marker { color:#7396c6; }
    .finder-hint-tip { display:grid; gap:3px; padding:11px 12px; border-radius:10px; background:#f5f8fd; font-size:12px; }
    .finder-hint-tip strong { color:#365f94; font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
    .finder-suggestions { margin-top:26px; display:grid; gap:12px; }
    .finder-suggestions[hidden] { display:none; }
    .finder-suggestions h2 { margin:0; font-size:18px; overflow-wrap:anywhere; }
    .finder-suggestions .product-grid button { overflow-wrap:anywhere; }
    .finder-help { display:flex; justify-content:space-between; background:transparent; color:#365f94; border-top:1px solid #e6ebf2; border-radius:0; font-size:13px; box-shadow:none; }
  </style>
</head>
<body data-screen="find">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script src="finder.js"></script>
</body>
</html>
