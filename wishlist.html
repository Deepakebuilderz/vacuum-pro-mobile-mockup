<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wishlist · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-screen="wishlist">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"><small>DEMO</small></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const items = catalog.flatMap((part, index) => wishlist.includes(part.sku) ? [index] : []);
      if (items.length) return title('Wishlist') + grid(items);
      return '<div class="centered-content"><div class="state-mark" aria-hidden="true"><svg viewBox="0 0 24 24">' +
        tabIcons.wishlist + '</svg></div>' + title('Wishlist') +
        '<p>Tap the heart on any product to save it here.</p>' + actions(['Browse products','browse']) + '</div>';
    });
  </script>
</body>
</html>
