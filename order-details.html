<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order details · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .stage[data-page="detail"] h1 { font-size: 25px; }
    .order-status { display: grid; gap: 8px; padding: 14px; border: 1px solid #d9e5f5; border-radius: 15px; background: #f3f7fd; }
    .order-status-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
    .order-status h2, .order-status p, .detail-items h2 { margin: 0; }
    .order-status h2, .detail-items h2 { font-size: 16px; }
    .order-status-pill { padding: 4px 9px; border-radius: 16px; background: #ffedcf; color: #81511c; font-size: 12px; font-weight: 700; }
    .order-status button { text-align: center; min-height: 44px; background: linear-gradient(105deg, #182d52, #284f86); }
    .detail-items { display: grid; gap: 8px; }
    .detail-items ul { margin: 0; padding: 0 10px; list-style: none; border: 1px solid var(--rule); border-radius: 13px; }
    .detail-items li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 9px 0; font-size: 13px; line-height: 1.35; }
    .detail-items li + li { border-top: 1px solid var(--rule); }
    .detail-thumb { width: 44px; height: 44px; padding: 3px; object-fit: contain; border-radius: 8px; background: #f3f7fd; }
    .detail-items small { color: var(--muted); white-space: nowrap; }
    .detail-support { align-self: center; color: #244b81; background: transparent; box-shadow: none; text-decoration: underline; }
  </style>
</head>
<body data-screen="detail">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"><small>DEMO</small></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const recent = visibleOrder();
      const count = recent.lines.reduce((total, [, quantity]) => total + quantity, 0);
      const items = recent.lines.map(([name, quantity]) => {
        const part = catalog.find(product => product.name === name);
        const thumbnail = part ? '<img class="detail-thumb" src="' + part.img + '" alt="">' :
          '<span class="detail-thumb" aria-hidden="true"></span>';
        return '<li>' + thumbnail + '<strong>' + escapeHTML(name) + '</strong><small>Qty ' + quantity + '</small></li>';
      }).join('');
      return title('Order #' + recent.number) +
        '<section class="order-status"><div class="order-status-head"><h2>Order status</h2><span class="order-status-pill">' + (recent.shipment ? 'Shipped' : 'Processing') + '</span></div>' +
        '<p class="quiet">' + (recent.shipment ? 'Use the tracking link in your shipping confirmation email for carrier updates.'
          : 'We’re preparing your order. A tracking link will be emailed after dispatch.') + '</p>' +
        button('Track shipment','tracking') + '</section>' +
        '<section class="detail-items"><h2>Products · ' + count + (count === 1 ? ' item' : ' items') + '</h2><ul>' + items + '</ul></section>' +
        '<button class="detail-support" type="button" data-go="support">Returns &amp; support</button>';
    });
  </script>
</body>
</html>
