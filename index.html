<script>
const view=document.querySelector('#view'), nav=document.querySelector('#nav');

const catalog=[
 {name:'Oreck XL2100 outer vacuum bag',brand:'Oreck',sku:'430001047',price:25.99,img:'oreck.png'},
 {name:'Hoover Type S HEPA bags',brand:'Hoover',sku:'4010808S',price:7.49,img:'hoover.png'}
];

const quantities=[0,0];
const total=()=>catalog.reduce((sum,p,i)=>sum+p.price*quantities[i],0);
const grid=()=>'<div class="product-grid">'+catalog.map((p,i)=>'<button type="button" data-go="item-'+i+'"><img src="'+p.img+'" alt=""><small>'+p.brand+'</small><strong>'+p.name+'</strong><span>'+money(p.price)+'</span></button>').join('')+'</div>';
const orderNames=()=>orderLines.map(([n,q])=>n+' × '+q).join('<br>');

let signed=false,qty=0,order=false,query='',matched=false,verified=false,preview='';
const button=(label,go,secondary=false)=>'<button type="button" data-go="'+go+'" class="'+(secondary?'secondary':'')+'">'+label+'</button>';

const screens={
 welcome:()=>'<div class="hero">'+'<span class="eyebrow">VACUUM PARTS & ACCESSORIES</span>'+title('Welcome to Vacuum PRO')+'<p>Sign in to see your orders, or start shopping as a guest.</p></div>'+actions(['Log in','login'],['Create an account','signup'],['Continue as guest','home']),

 '<div class="home-tools unified-find"><button type="button" data-go="find"><svg viewBox="0 0 24 24" aria-hidden="true">'+tabIcons.find+'</svg><span>Find a part<small>Search by number or scan a photo</small></span></button></div>'+
 '<section class="home-shop"><h2>Shop by category</h2><button type="button" data-go="browse"><span>Vacuum bags</span><span aria-hidden="true">›</span></button></section>'+

 '<button class="example" type="button" data-go="sample-number">Try part #430001047</button></section>'+
 '<button class="finder-scan" type="button" data-go="scan"><span class="scan-icon" aria-hidden="true"><svg viewBox="0 0 24 24">'+tabIcons.scan+'</svg></span><span><strong>Scan a photo</strong><small>Use a photo of the model sticker or part label</small></span></button>'+

 scan:()=>'<section class="finder-intro">'+title('Scan a label')+'<p>Photograph the vacuum model sticker or the number printed on the part.</p></section>'+
 '<label class="scan-upload"><svg viewBox="0 0 24 24" aria-hidden="true">'+tabIcons.scan+'</svg><strong>Choose label photo</strong><small>Use a sharp image with the full number visible</small><input id="photo" type="file" accept="image/*" aria-label="Choose label photo"><img class="preview" id="preview" alt="Selected label photo" hidden><p id="scan-preview-note" class="quiet" aria-live="polite" hidden></p></label>'+
 '<section class="scan-demo"><h2>Try a sample scan</h2>'+actions(['Try clear sample photo','confirm'],['Try unreadable sample','unknown'])+'</section>'+button('Search manually','find',true),
 confirm:()=>title('Confirm the model')+'<p>Sample scan detected an Oreck model. Check the number before continuing.</p>'+form('model','<label>Model number<input name="model" value="XL2100" required></label>','Find compatible parts')+actions(['Retake photo','scan'],['Search manually','find']),
 unknown:()=>title('Fit not confirmed')+card('TRY A CLEARER PHOTO','Retake the label photo, search by number, or contact Vacuum PRO with your model.','warn')+actions(['Retake photo','scan'],['Search manually','find'],['Get fitment help','support']),
 product:()=>title(catalog[current].name)+ '<img class="product-photo" src="'+catalog[current].img+'" alt="">' +productCard(catalog[current])+card('CHECK COMPATIBILITY','Confirm your model before ordering.')+actions(['Add to cart','add'],current===0?['Check my model','confirm']:['Ask about compatibility','support']),
 cart:()=>title('Shopping cart')+(qty?catalog.map((p,i)=>quantities[i]?productCard(p)+button('Remove one '+p.brand+' item','remove-'+i,true):'').join('')+card('CART TOTAL',qty+' item(s) · '+money(total())+'<br><span class="quiet">Shipping and tax at checkout</span>')+actions(['Checkout','checkout'],['Continue shopping','home']):'<p>Your cart is empty.</p>'+actions(['Shop vacuum bags','browse'])),
 checkout:()=>title('Shopify checkout')+card('DEMO CHECKOUT',(signed?'Signed-in customer':'Guest checkout')+'<br>Standard shipping · $5.99<br>Demo total · '+money(total()+5.99))+actions(['Place demo order','place'],['Try payment decline','failure'],['Back to cart','cart']),
 failure:()=>title('Payment declined')+card('ORDER NOT PLACED','Choose another payment method or return to your cart.','warn')+actions(['Retry checkout','checkout'],['Back to cart','cart']),
 thanks:()=>title('Order confirmed')+card('ORDER #VP-1042','In the live app, confirmation and tracking updates would be sent by email.')+actions(['View order details','detail'],['Continue shopping','home']),
 account:()=>title('My account')+(signed?actions(['Order history','orders'],['Get help','support'],['Log out','logout']):'<p>Log in to see your order history.</p>'+actions(['Log in','login'],['Create an account','signup'],['Get help','support'])),
 orders:()=>title('Order history')+(order?card('#VP-1042',orderNames()+'<br>Processing')+actions(['View order','detail']):'<p>No demo orders yet.</p>')+actions(['Back to account','account']),
 detail:()=>title('Order #VP-1042')+card('PROCESSING',orderNames()+'<br>Tracking appears after dispatch.')+actions(['Track shipment','tracking'],['Return / Get help','support'],['Continue shopping','home']),
 tracking:()=>title('Track shipment')+card('PROCESSING','Your order is being prepared. Tracking will be emailed once it ships.')+actions(['Back to order','detail']),
 support:()=>title('Returns & support')+card('CONTACT VACUUM PRO','support@vacuumpro.com<br>1-888-594-3555')+card('RETURNS','Contact support for authorization before sending a return.')+card('FITMENT HELP','Share the vacuum brand and model plus the number on the old part.')+actions(['Back to Find a Part','find'])
};
const tabIcons={
 home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',
 find:'<circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/>',
 scan:'<path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4M7 12h10"/>',
 cart:'<path d="M3 4h2l2.4 11h11.7l2-7H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>',
 account:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>'
};
const tabGroups={browse:'home',results:'find',product:'find',scan:'find',confirm:'find',unknown:'find',checkout:'cart',failure:'cart',orders:'account',detail:'account',tracking:'account',support:'account'};
function renderTabs(page){
 const active=tabGroups[page]||page;
 nav.innerHTML=Object.entries({home:'Home',find:'Find a part',cart:'Cart',account:'Account'}).map(([key,label])=>{
  const badge=key==='cart'&&qty?'<span class="cart-badge">'+qty+'</span>':'';
  const current=key===active?' aria-current="page"':'';
  const aria=key==='cart'?' aria-label="Cart ('+qty+')"':'';
  return '<button type="button" data-go="'+key+'"'+current+aria+'><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24">'+tabIcons[key]+'</svg>'+badge+'</span><span>'+label+'</span></button>';
 }).join('');
}
function render(page){
 if(!Object.hasOwn(screens,page))page='welcome';
 if(page==='orders'&&!signed)page='login';
 if(['detail','tracking','thanks'].includes(page)&&!order)page='account';
 if(page==='checkout'&&!qty)page='cart';
 const stage=document.querySelector('.stage'); stage.dataset.page=page; stage.scrollTop=0;
 const auth=['login','signup','reset','inbox'].includes(page); const centered=auth||(page==='cart'&&!qty)||(page==='account'&&!signed);
 stage.dataset.centered=String(centered);
 view.classList.remove('motion-in');
 void view.offsetWidth;
 view.classList.add('motion-in');
 const content=screens[page]();
 const icon=page==='cart'
   ? '<path d="M3 4h2l2.4 11h11.7l2-7H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>'
   : '<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>';
 view.innerHTML=auth?'<div class="centered-content auth-content">'+content+'</div>':centered?'<div class="centered-content"><div class="state-mark" aria-hidden="true"><svg viewBox="0 0 24 24">'+icon+'</svg></div>'+content+'</div>':content;
 nav.hidden=['welcome','login','signup','reset','inbox'].includes(page);
 nav.style.display=nav.hidden?'none':'flex';
 renderTabs(page);
 view.querySelector('h1')?.focus({preventScroll:true});window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
 const go=e.target.closest('button[data-go]')?.dataset.go;if(!go)return; if(go==='sample-number'){const field=view.querySelector('input[name=query]');field.value='430001047';field.focus();return}
 if(go==='product'||go==='item-0'||go==='item-1'){current=go==='item-1'?1:0;return render('product')}
 if(go==='add'){qty++;quantities[current]++;return render('cart')}
 if(go==='remove-0'||go==='remove-1'){const i=Number(go.slice(-1));if(quantities[i]){quantities[i]--;qty--}return render('cart')}
 if(go==='place'){if(qty){orderLines=catalog.map((p,i)=>[p.name,quantities[i]]).filter(([,q])=>q);quantities.fill(0);order=true;qty=0;return render('thanks')}return render('cart')}
 if(go==='logout'){signed=false;return render('welcome')}
 render(go);
});
view.addEventListener('submit',e=>{
 e.preventDefault();const data=new FormData(e.target);
 if(['login','signup'].includes(e.target.id)){signed=true;return render('home')}
 if(e.target.id==='reset')return render('inbox');
 if(e.target.id==='search'){query=String(data.get('query'));matched=matches(query);verified=matched&&/xl/i.test(query);return render('results')}
 if(e.target.id==='model'){const model=String(data.get('model'));verified=matches(model)&&/xl/i.test(model);matched=verified;return render(verified?'results':'unknown')}
});
view.addEventListener('change',e=>{
 if(e.target.id!=='photo'||!e.target.files[0])return;
 if(preview)URL.revokeObjectURL(preview);
 preview=URL.createObjectURL(e.target.files[0]);
 const img=document.querySelector('#preview');img.src=preview;img.hidden=false;
 const note=document.querySelector('#scan-preview-note');note.hidden=false;note.textContent='Photo preview only. Try a sample below to see a demo result.';
});
render('welcome');
</script></html>
