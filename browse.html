<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-screen="browse">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => {
      const categories = [...new Set(catalog.map(partCategory))];
      return title('Shop vacuum parts') + '<p class="quiet">Catalog snapshot from Vacuum PRO</p>' +
        categories.map(category => {
          const items = catalog.flatMap((part, index) => partCategory(part) === category ? [index] : []);
          return '<section class="home-shop"><h2>' + category + '</h2>' + grid(items) + '</section>';
        }).join('') + actions(['Find by model or part number','find']);
    });
  </script>
</body>
</html>
