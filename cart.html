<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · Vacuum PRO</title>
  <link rel="stylesheet" href="styles.css">
  <style>

    .stage[data-page="cart"] main { gap: 12px; }
    .stage[data-page="cart"] h1 { font-size: 25px; }
    .cart-line { grid-template-columns: 68px minmax(0, 1fr); align-items: start; }
    .cart-line img {
      width: 68px;
      height: 68px;
      padding: 6px;
      border-radius: 9px;
      background: #f3f6fb;
      mix-blend-mode: multiply;
    }
    .cart-line strong { display: block; font-size: 14px; line-height: 1.35; }
    .cart-line p { margin: 4px 0; font-size: 12px; }
    .cart-line .stepper {
      display: inline-flex;
      gap: 2px;
      border: 1px solid var(--rule);
      border-radius: 10px;
      background: #f6f9fd;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .cart-line .stepper button {
      min-height: 44px;
      padding: 0;
      background: transparent;
      font-size: 17px;
      font-weight: 500;
    }
    .cart-line .stepper button:hover { background: #e8effa; }
    .cart-line .stepper span { min-width: 2ch; text-align: center; }
    .stage[data-page="cart"] .checkout-box { gap: 8px; }
    .stage[data-page="cart"] .checkout-box h2 { font-size: 17px; }
    .stage[data-page="cart"] button[data-go="checkout"] {
      background: linear-gradient(105deg, #182d52, #284f86);
    }
    .stage[data-page="cart"] button[data-go="home"] {
      color: #244b81;
      background: transparent;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body data-screen="cart">
  <div id="shell"><header><img src="logo.png" alt="Vacuum PRO"></header><div class="stage"><aside class="story" aria-label="Vacuum PRO parts"><div class="story-content"><div class="eyebrow">VACUUM PRO / PARTS &amp; ACCESSORIES</div><h2>The right part starts here.</h2><p>Find replacement bags, filters and more by model, part number or a photo of the label.</p><div class="tags"><span>Vacuum bags</span><span>Filters</span><span>Belts &amp; accessories</span></div></div></aside><main id="view"></main></div><nav aria-label="Store navigation" id="nav"></nav></div>
  <script src="app.js"></script>
  <script>
    mountScreen(() => title('Shopping cart')+(qty?cartLines()+summary()+actions(['Checkout','checkout'],['Continue shopping','home']):'<p>Your cart is empty.</p>'+actions(['Shop vacuum parts','browse'])));
  </script>
</body>
</html>
